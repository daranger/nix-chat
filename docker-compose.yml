# Local development infrastructure. Passwords here are for development only.
# File storage (for photos and files) will be added when file sharing reaches the server.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nixchat
      POSTGRES_USER: nixchat
      POSTGRES_PASSWORD: nixchat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
