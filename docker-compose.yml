# Local development infrastructure. Passwords here are for development only.
# File storage (for photos and files) will be added when file sharing reaches the server.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nixchat
      POSTGRES_USER: nixchat
      POSTGRES_PASSWORD: nixchat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  # Web UI for the database (like phpMyAdmin, but for PostgreSQL): http://localhost:8081
  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
