# Local development infrastructure. Passwords here are for development only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nixchat
      POSTGRES_USER: nixchat
      POSTGRES_PASSWORD: nixchat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nixchat
      MINIO_ROOT_PASSWORD: nixchat-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
