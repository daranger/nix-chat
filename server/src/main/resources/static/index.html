<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nchat Web (test client)</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --accent: #1f6feb; --accent-text: #ffffff; --danger: #f85149; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; }
  .hidden { display: none !important; }

  /* Login */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; align-self: center; }
  h1 { margin: 0; font-size: 20px; text-align: center; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input { height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 16px; }
  .primary { height: 44px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: default; }
  .link { background: none; border: 0; color: #58a6ff; cursor: pointer; padding: 8px; }
  .error { color: var(--danger); font-size: 14px; min-height: 1em; }
  .note { color: var(--muted); font-size: 12px; text-align: center; }

  /* Chat */
  #chat { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header .title { font-weight: 600; flex: 1; }
  header .me { color: var(--muted); font-size: 13px; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
  .status.online { color: var(--ok); border-color: #238636; }
  .ghost { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #feed { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); align-self: flex-start; word-wrap: break-word; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .msg .who { font-size: 12px; font-weight: 600; color: #d29922; margin-bottom: 2px; }
  .msg .time { font-size: 11px; opacity: .7; text-align: right; margin-top: 2px; }
  .system { align-self: center; color: var(--muted); font-size: 12px; font-style: italic; }
  form#send { display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--panel); }
  form#send input { flex: 1; min-width: 0; }
</style>
</head>
<body>

<section id="login">
  <form class="card" id="authForm" autocomplete="on">
    <div class="logo" aria-hidden="true">N</div>
    <h1 id="authTitle">Sign in to Nchat</h1>
    <label>Username <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32"></label>
    <label id="displayNameRow" class="hidden">Display name (optional) <input id="displayName" maxlength="64"></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72"></label>
    <div class="error" id="authError" role="alert"></div>
    <button class="primary" id="authSubmit" type="submit">Sign in</button>
    <button class="link" id="switchMode" type="button">New to Nchat? Create an account</button>
    <div class="note">Web test client · same accounts as the desktop app</div>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <span class="title">General</span>
    <span class="me" id="me"></span>
    <span class="status" id="status">Connecting…</span>
    <button class="ghost" id="signOut" type="button">Sign out</button>
  </header>
  <div id="feed" aria-live="polite"></div>
  <form id="send">
    <label for="text" class="hidden">Message</label>
    <input id="text" placeholder="Write a message…" maxlength="4096" autocomplete="off">
    <button class="primary" type="submit" style="padding: 0 18px">Send</button>
  </form>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = 'nixchat.token', USER_KEY = 'nixchat.user';
  let registerMode = false, socket = null, me = null, retryTimer = null;

  // ---------- storage (may be unavailable in private mode) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ---------- API ----------
  async function api(path, body, token) {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      const err = new Error(data.error || (res.status === 401 ? 'Please sign in again' : 'Server error (' + res.status + ')'));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // ---------- login screen ----------
  function setMode(register) {
    registerMode = register;
    $('authTitle').textContent = register ? 'Create your Nchat account' : 'Sign in to Nchat';
    $('authSubmit').textContent = register ? 'Create account' : 'Sign in';
    $('switchMode').textContent = register ? 'Already have an account? Sign in' : 'New to Nchat? Create an account';
    $('displayNameRow').classList.toggle('hidden', !register);
    $('password').autocomplete = register ? 'new-password' : 'current-password';
    $('authError').textContent = '';
  }
  $('switchMode').onclick = () => setMode(!registerMode);

  $('authForm').onsubmit = async (e) => {
    e.preventDefault();
    $('authError').textContent = '';
    $('authSubmit').disabled = true;
    try {
      const username = $('username').value.trim(), password = $('password').value;
      const session = registerMode
        ? await api('/api/auth/register', { username, displayName: $('displayName').value.trim(), password })
        : await api('/api/auth/login', { username, password });
      store.set(TOKEN_KEY, session.token);
      store.set(USER_KEY, JSON.stringify({ username: session.username, displayName: session.displayName }));
      openChat(session.token, session);
    } catch (err) {
      $('authError').textContent = err.message === 'Failed to fetch' ? 'Server is not reachable' : err.message;
    } finally {
      $('authSubmit').disabled = false;
    }
  };

  function showLogin(message) {
    closeSocket();
    $('chat').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('authError').textContent = message || '';
  }

  // ---------- chat ----------
  function openChat(token, user) {
    me = user;
    $('me').textContent = '@' + user.username;
    $('feed').innerHTML = '';
    $('login').classList.add('hidden');
    $('chat').classList.remove('hidden');
    connect(token);
    $('text').focus();
  }

  function connect(token) {
    closeSocket();
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    setStatus('Connecting…', false);
    socket = new WebSocket(proto + '//' + location.host + '/ws?token=' + encodeURIComponent(token));
    socket.onopen = () => setStatus('Online', true);
    socket.onmessage = (event) => addFrame(event.data);
    socket.onclose = () => {
      setStatus('Offline', false);
      if (store.get(TOKEN_KEY)) {
        // Check whether the token is still valid; reconnect if so
        retryTimer = setTimeout(async () => {
          try { await api('/api/me', null, token); connect(token); }
          catch (err) { if (err.status === 401) { store.del(TOKEN_KEY); showLogin('Your session has expired, please sign in again'); } else { socket = null; connect(token); } }
        }, 3000);
      }
    };
  }

  function closeSocket() {
    clearTimeout(retryTimer);
    if (socket) { socket.onclose = null; socket.close(); socket = null; }
  }

  function setStatus(text, online) {
    $('status').textContent = text;
    $('status').classList.toggle('online', online);
  }

  // Server frames: "username: text" for messages, anything else is a system notice
  function addFrame(raw) {
    const feed = $('feed');
    const sep = raw.indexOf(': ');
    const username = sep > 0 ? raw.slice(0, sep) : '';
    const el = document.createElement('div');
    if (sep > 0 && /^[\p{L}\p{N}_-]{3,32}$/u.test(username)) {
      const mine = me && username === me.username;
      el.className = 'msg' + (mine ? ' mine' : '');
      if (!mine) {
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = username;
        el.appendChild(who);
      }
      const body = document.createElement('div');
      body.textContent = raw.slice(sep + 2);
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      el.append(body, time);
    } else {
      el.className = 'system';
      el.textContent = raw;
    }
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
    feed.appendChild(el);
    if (atBottom || (me && el.classList.contains('mine'))) feed.scrollTop = feed.scrollHeight;
  }

  $('send').onsubmit = (e) => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    if (!socket || socket.readyState !== WebSocket.OPEN) { addFrame('Not connected to the server'); return; }
    socket.send(text);
    $('text').value = '';
  };

  $('signOut').onclick = () => {
    store.del(TOKEN_KEY);
    store.del(USER_KEY);
    showLogin();
  };

  // ---------- start ----------
  setMode(false);
  const savedToken = store.get(TOKEN_KEY);
  if (savedToken) {
    api('/api/me', null, savedToken)
      .then((user) => openChat(savedToken, user))
      .catch(() => { store.del(TOKEN_KEY); showLogin(); });
  }
})();
</script>
</body>
</html>
