# Tests run against an in-memory H2 database, so no PostgreSQL is needed for "gradlew build"
spring:
  datasource:
    url: jdbc:h2:mem:nixchat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

nixchat:
  jwt:
    secret: test-secret-0123456789abcdef0123456789abcdef
    ttl: 1h
  phone:
    pepper: test-phone-pepper-0123456789abcdef0123456789
    telegram-token: ""
    code-ttl: 5m
